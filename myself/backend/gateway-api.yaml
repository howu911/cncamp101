# Gateway API资源需要先安装Gateway API CRDs
# 安装命令: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.0.0/standard-install.yaml

# GatewayClass定义
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: example-gateway-class
spec:
  controllerName: example.com/gateway-controller

---
# Gateway定义 - 相当于Ingress Controller
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same

---
# 基于路径的HTTPRoute - 相当于第一个Ingress对象
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: path-based-route
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "test.example.com"
  rules:
  # API V1 路径规则
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1
    backendRefs:
    - name: api-service
      port: 80
  
  # API V2 路径规则
  - matches:
    - path:
        type: PathPrefix
        value: /api/v2
    backendRefs:
    - name: status-service
      port: 80
  
  # 应用路径规则
  - matches:
    - path:
        type: PathPrefix
        value: /app
    backendRefs:
    - name: dashboard-service
      port: 80
  
  # 根路径规则
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: api-service
      port: 80

---
# API子域名HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-subdomain-route
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "api.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: api-service
      port: 80

---
# 状态子域名HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: status-subdomain-route
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "status.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: status-service
      port: 80

---
# 仪表板子域名HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard-subdomain-route
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "dashboard.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: dashboard-service
      port: 80 