apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-test
  annotations:
    # 移除重写目标注解，确保请求路径不变
    # nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: test.example.com  # 替换为您自己的域名
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ingress-test-backend
            port:
              number: 80 